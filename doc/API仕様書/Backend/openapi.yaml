openapi: 3.1.0
info:
  title: Nextjs Sample - Backend Contract
  version: 1.0.0
  description: |
    Next.js の BFF 層 (`src/lib/backend.ts`) が、実バックエンド
    (`BACKEND_API_URL`) に対して呼び出す想定の API 契約。実バックエンドの
    実装者はこの仕様を満たすこと。`BACKEND_API_URL` が未設定の間は
    `src/lib/mock-todos.ts` / `src/lib/mock-data.ts` がこの契約と同じ形の
    データをアプリ内でモックしている。
servers:
  - url: "{backendApiUrl}"
    description: BACKEND_API_URL環境変数が指す実バックエンドサーバー
    variables:
      backendApiUrl:
        default: https://example.com/api
        description: BACKEND_API_URL 環境変数の値
tags:
  - name: user
    description: ユーザー
  - name: todo
    description: Todoの管理
paths:
  /users:
    get:
      tags: [user]
      summary: ユーザー一覧取得
      description: 登録されている全ユーザーを返す。ページングは行わない。
      operationId: listUsers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../common/schemas/User.yaml#/User"

  /todos:
    get:
      tags: [todo]
      summary: Todo一覧取得
      description: 登録されている全Todoを追加順(古い順)で返す。
      operationId: listTodos
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../common/schemas/Todo.yaml#/Todo"
    post:
      tags: [todo]
      summary: Todo作成
      description: 新しいTodoを登録する。title・dueDate・assignee・statusが必須。
      operationId: createTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../common/schemas/Todo.yaml#/TodoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "../common/schemas/Todo.yaml#/Todo"

  /todos/{id}:
    put:
      tags: [todo]
      summary: Todo更新
      description: 指定したidのTodoをtitle・dueDate・assignee・statusで全体更新する。
      operationId: updateTodo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../common/schemas/Todo.yaml#/TodoInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "../common/schemas/Todo.yaml#/Todo"
    delete:
      tags: [todo]
      summary: Todo削除
      description: 指定したidのTodoを削除する。
      operationId: deleteTodo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
