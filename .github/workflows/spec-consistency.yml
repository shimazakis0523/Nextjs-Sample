name: Spec consistency

on:
  pull_request:
    branches: [main]

jobs:
  spec-sync:
    name: ユースケース記述・画面定義書 / E2E仕様書 / 画面遷移図 sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/scripts/check-spec-sync.sh "origin/${{ github.base_ref }}"

  openapi-routes:
    name: doc/API仕様書/BFF/openapi.yaml vs src/app/api/** routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run openapi:lint
      - run: node .github/scripts/check-openapi-bff-routes.mjs

  openapi-style-guide:
    name: doc/API仕様書/**/openapi.yaml conforms to the OpenAPI style guide (Spectral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run openapi:lint:spectral

  detailed-design-doc:
    name: doc/フロントエンド設計書/**/詳細設計書.md structural conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/check-detailed-design-doc.mjs

  frontend-nonfunctional-policy:
    name: AP方式設計書(フロントエンド編).md's non-functional policy is decided
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/check-frontend-nonfunctional-policy.mjs

  url-path-design:
    name: src/app/** route segments conform to URL path design conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/check-url-path-design.mjs

  component-naming:
    name: src/app/**/*.tsx component files are PascalCase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/check-component-naming.mjs

  a11y-test-coverage:
    name: src/app/**/page.tsx screens have an automated axe-core check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/check-a11y-test-coverage.sh

  component-test-coverage:
    name: src/app/**/*.tsx components have a unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/scripts/check-component-tests.sh "origin/${{ github.base_ref }}"

  unit-test-coverage:
    name: unit test coverage meets the jest.config.ts threshold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:coverage

  code-quality:
    name: ESLint (complexity/duplication quality rules) has 0 errors and 0 warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint:ci

  governance-issue-reference:
    name: governance file changes reference a GitHub Issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: .github/scripts/check-governance-issue-ref.sh "origin/${{ github.base_ref }}"
